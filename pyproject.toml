[build-system]
requires = ["setuptools>=68", "Cython>=3.2,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "byse-resolver"
version = "0.1.0"
description = "Byse embed resolver with a Cython-accelerated proof-of-work solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "cryptography>=43"]

[project.scripts]
byse-resolver = "byse_resolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
byse_resolver = ["*.pyx"]
